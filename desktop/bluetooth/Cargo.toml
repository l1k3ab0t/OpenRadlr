[package]
name = "openradlr-bluetooth"
version = "0.1.0"
description = "BlueZ access for the OpenRadlr Linux client"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
async-trait = "0.1"
bluer = { version = "0.17", features = ["bluetoothd"] }
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
