[package]
name = "openradlr-desktop"
version = "0.1.0"
description = "OpenRadlr Linux desktop shell"
edition = "2021"
license = "AGPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures = "0.3"
hex = "0.4"
openradlr-bluetooth = { path = "../bluetooth" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["time"] }
